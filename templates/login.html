<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Plataforma de Gestión</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #101216 0%, #1e2430 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f7fafc;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 40px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 42px;
            color: #ED8936; /* Naranja corporativo */
            background: rgba(237, 137, 54, 0.1);
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(237, 137, 54, 0.2);
        }

        .app-name {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .app-subtitle {
            font-size: 13px;
            color: #718096;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #a0aec0;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #718096;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: #ED8936;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(237, 137, 54, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #ED8936;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(237, 137, 54, 0.3);
        }

        .btn-submit:hover {
            background: #dd7a27;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(237, 137, 54, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .flash-messages {
            margin-bottom: 20px;
            text-align: left;
        }

        .flash-msg {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .flash-msg.danger {
            background: rgba(229, 62, 62, 0.15);
            color: #fc8181;
            border: 1px solid rgba(229, 62, 62, 0.2);
        }

        .flash-msg.info {
            background: rgba(66, 153, 225, 0.15);
            color: #63b3ed;
            border: 1px solid rgba(66, 153, 225, 0.2);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-container">
            <div class="logo-icon">
                <i class="fa-solid fa-briefcase"></i>
            </div>
            <h1 class="app-name">Plataforma de Gestión</h1>
            <p class="app-subtitle">Ingresa tus credenciales para continuar</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash-msg {{ category }}">
                            <i class="fa-solid fa-circle-exclamation"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="username">Usuario</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input class="form-input" type="text" id="username" name="username" placeholder="Tu usuario" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
